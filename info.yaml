# Tiny Tapeout project information
project:
  title: "4-bit Combination Lock with 4x4 Matrix Keypad"
  author: "MiguelGomez"
  discord: ""
  description: "A TinyTapeout-style 4-bit combination lock using a 4x4 matrix keypad, an active-high 7-segment display output, and a temporary lockout timer after three failed attempts."
  language: "Verilog"
  clock_hz: 40000000
  tiles: "1x1"
  top_module: "tt_um_combolock"
  source_files:
    - "tt_um_combolock.v"
    - "keypad_scanner.v"
    - "seven_seg_decoder.v"

pinout:
  ui[0]: "unused_reserved"
  ui[1]: "unused_reserved"
  ui[2]: "unused_reserved"
  ui[3]: "unused_reserved"
  ui[4]: "unused_reserved"
  ui[5]: "unused_reserved"
  ui[6]: "unused_reserved"
  ui[7]: "unused_reserved"

  uo[0]: "seven_segment_a_active_high"
  uo[1]: "seven_segment_b_active_high"
  uo[2]: "seven_segment_c_active_high"
  uo[3]: "seven_segment_d_active_high"
  uo[4]: "seven_segment_e_active_high"
  uo[5]: "seven_segment_f_active_high"
  uo[6]: "seven_segment_g_active_high"
  uo[7]: "decimal_point_lockout_active_high"

  uio[0]: "keypad_row_0_active_low_output"
  uio[1]: "keypad_row_1_active_low_output"
  uio[2]: "keypad_row_2_active_low_output"
  uio[3]: "keypad_row_3_active_low_output"
  uio[4]: "keypad_column_0_active_low_input"
  uio[5]: "keypad_column_1_active_low_input"
  uio[6]: "keypad_column_2_active_low_input"
  uio[7]: "keypad_column_3_active_low_input"

yaml_version: 6
