# Tiny Tapeout project information
project:
  title:        "4-bit Combination Lock with 4x4 Matrix Keypad"
  author:       "MiguelGomez"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A TinyTapeout-style 4-bit combination lock using a 4x4 matrix keypad instead of DIP switches."
  language:     "Verilog"
  clock_hz:     40000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_combolock"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_combolock.v"
    - "keypad_scanner.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "unused/reserved"
  ui[1]: "unused/reserved"
  ui[2]: "unused/reserved"
  ui[3]: "unused/reserved"
  ui[4]: "unused/reserved"
  ui[5]: "unused/reserved"
  ui[6]: "unused/reserved"
  ui[7]: "unused/reserved"

  # Outputs
  uo[0]: "unlocked"
  uo[1]: "locked_out"
  uo[2]: "failed_attempts[0]"
  uo[3]: "failed_attempts[1]"
  uo[4]: "password/debug bit 0"
  uo[5]: "password/debug bit 1"
  uo[6]: "password/debug bit 2"
  uo[7]: "password/debug bit 3"

  # Bidirectional pins
  uio[0]: "keypad row 0 output"
  uio[1]: "keypad row 1 output"
  uio[2]: "keypad row 2 output"
  uio[3]: "keypad row 3 output"
  uio[4]: "keypad column 0 input"
  uio[5]: "keypad column 1 input"
  uio[6]: "keypad column 2 input"
  uio[7]: "keypad column 3 input"

# Do not change!
yaml_version: 6
