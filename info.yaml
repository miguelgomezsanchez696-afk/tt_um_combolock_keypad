# Tiny Tapeout project information
project:
  title: "4-bit Combination Lock with 4x4 Matrix Keypad"
  author: "MiguelGomez"
  discord: ""
  description: "A TinyTapeout-style 4-bit combination lock using a 4x4 matrix keypad, with temporary lockout after three failed attempts."
  language: "Verilog"
  clock_hz: 40000000
  tiles: "1x1"
  top_module: "tt_um_combolock"
  source_files:
    - "tt_um_combolock.v"
    - "keypad_scanner.v"
    - "seven_seg_decoder.v"

pinout:
  ui[0]: "unused"
  ui[1]: "unused"
  ui[2]: "unused"
  ui[3]: "unused"
  ui[4]: "unused"
  ui[5]: "unused"
  ui[6]: "unused"
  ui[7]: "unused"

  uo[0]: "seven_segment_a"
  uo[1]: "seven_segment_b"
  uo[2]: "seven_segment_c"
  uo[3]: "seven_segment_d"
  uo[4]: "seven_segment_e"
  uo[5]: "seven_segment_f"
  uo[6]: "seven_segment_g"
  uo[7]: "decimal_point_lockout"

  uio[0]: "keypad_row_0"
  uio[1]: "keypad_row_1"
  uio[2]: "keypad_row_2"
  uio[3]: "keypad_row_3"
  uio[4]: "keypad_column_0"
  uio[5]: "keypad_column_1"
  uio[6]: "keypad_column_2"
  uio[7]: "keypad_column_3"

yaml_version: 6
